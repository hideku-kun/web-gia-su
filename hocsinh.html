<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Học Tập</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --primary-soft: #EEF2FF;
            --bg: #F5F7FB;
            --surface: #FFFFFF;
            --text-main: #172033;
            --text-sub: #667085;
            --border: #E4E7EC;
            --success: #12B76A;
            --success-soft: #ECFDF3;
            --warning: #F79009;
            --shadow: 0 8px 30px rgba(16,24,40,.07);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            margin: 0;
            color: var(--text-main);
        }

        button, input, select { font: inherit; }

        .container {
            max-width: 1180px;
            margin: auto;
            padding: 20px;
        }

        .top-bar {
            position: sticky;
            top: 12px;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,.94);
            backdrop-filter: blur(12px);
            padding: 14px 18px;
            border: 1px solid rgba(228,231,236,.9);
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 22px;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            background: var(--primary-soft);
        }

        .tabs { display: flex; gap: 7px; }

        .tabs button {
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            border-radius: 10px;
        }

        .tabs button:hover { background: #F8FAFC; color: var(--text-main); }

        .tabs button.active-btn {
            color: var(--primary);
            border-color: #C7D2FE;
            background: var(--primary-soft);
        }

        .select-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: flex-end;
        }

        select {
            padding: 11px 14px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            font-weight: 500;
            min-width: 280px;
            cursor: pointer;
            color: var(--text-main);
        }

        select:focus, input:focus {
            border-color: #A5B4FC;
            box-shadow: 0 0 0 3px rgba(79,70,229,.10);
        }

        .section { display: none; animation: fadeIn .25s ease; }
        .section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }


        .exercise-instruction {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 14px;
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-wrap;
            box-shadow: 0 3px 15px rgba(16,24,40,.035);
        }
        .exercise-instruction-title {
            display: block;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 4px;
        }

        /* Exercise */
        .exercise-shell { display: none; }

        .exercise-header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px 22px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .exercise-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 13px;
        }

        .exercise-title {
            margin: 0;
            font-size: 21px;
            font-weight: 700;
        }

        .progress-pill {
            white-space: nowrap;
            padding: 8px 12px;
            border-radius: 999px;
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
        }

        .progress-track {
            height: 7px;
            background: #EEF0F4;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: inherit;
            transition: width .25s ease;
        }

        .exercise-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 230px;
            gap: 16px;
            align-items: start;
        }

        .question-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .question-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 3px 15px rgba(16,24,40,.035);
            scroll-margin-top: 100px;
            transition: border-color .2s, box-shadow .2s;
        }

        .question-card.answered {
            border-color: #C7D2FE;
        }

        .question-card.current {
            box-shadow: 0 0 0 2px rgba(79,70,229,.12);
        }

        .question-text {
            font-size: 16px;
            line-height: 1.75;
            white-space: pre-wrap;
        }

        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
            height: 30px;
            padding: 0 8px;
            border-radius: 9px;
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* Multiple choice */
        .options-list {
            display: grid;
            gap: 9px;
            margin-top: 16px;
        }

        .answer-option {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            border: 1.5px solid var(--border);
            border-radius: 11px;
            cursor: pointer;
            transition: all .15s ease;
            user-select: none;
            background: white;
        }

        .answer-option:hover {
            border-color: #A5B4FC;
            background: #FAFAFF;
        }

        .answer-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .answer-option .letter {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border: 1px solid #D0D5DD;
            border-radius: 8px;
            font-weight: 700;
            color: var(--text-sub);
            flex: 0 0 auto;
        }

        .answer-option:has(input:checked) {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .answer-option:has(input:checked) .letter {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .answer-option .option-text {
            line-height: 1.5;
            font-size: 15px;
        }

        /* Fill-in */
        .inline-answer {
            display: inline-block;
            min-width: 150px;
            width: min(330px, 70%);
            margin: 0 5px;
            padding: 4px 9px;
            border: none;
            border-bottom: 2px solid #98A2B3;
            outline: none;
            background: #F8FAFC;
            border-radius: 6px 6px 0 0;
            color: var(--primary);
            font-weight: 600;
            vertical-align: baseline;
            transition: all .15s;
        }

        .inline-answer:focus {
            border-bottom-color: var(--primary);
            background: var(--primary-soft);
            box-shadow: none;
        }

        .inline-answer::placeholder { color: #98A2B3; font-weight: 400; }

        .question-help {
            margin-top: 11px;
            font-size: 12px;
            color: var(--text-sub);
        }

        /* Sidebar */
        .question-nav {
            position: sticky;
            top: 105px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .question-nav h3 {
            margin: 0 0 13px;
            font-size: 14px;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }

        .number-btn {
            height: 34px;
            border: 1px solid var(--border);
            background: white;
            color: var(--text-sub);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .number-btn:hover { border-color: #A5B4FC; }

        .number-btn.answered {
            background: var(--success-soft);
            border-color: #ABEFC6;
            color: var(--success);
        }

        .number-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .legend {
            margin-top: 15px;
            padding-top: 13px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.8;
        }

        .legend span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
            background: #D0D5DD;
        }

        .legend .done-dot { background: var(--success); }

        .submit-bar {
            position: sticky;
            bottom: 14px;
            z-index: 20;
            margin-top: 16px;
            background: rgba(255,255,255,.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 8px 25px rgba(16,24,40,.10);
        }

        .btn-nop {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 13px;
            font-weight: 700;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-nop:hover { background: var(--primary-hover); }


        .exam-section-student {
            background: transparent;
            margin-bottom: 16px;
        }
        .exam-section-student-title {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px 14px 0 0;
            padding: 15px 18px;
            color: var(--primary);
            font-size: 16px;
            font-weight: 700;
        }
        .exam-section-student-instruction {
            background: #F8FAFC;
            border: 1px solid var(--border);
            border-top: none;
            padding: 14px 18px;
            white-space: pre-wrap;
            line-height: 1.7;
            color: var(--text-sub);
            font-size: 14px;
        }
        .exam-section-questions {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        /* Flashcards */
        .flashcard-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 25px;
            min-height: 400px;
        }

        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            max-width: 500px;
            height: 300px;
            cursor: pointer;
            margin-bottom: 35px;
            position: relative;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            transition: transform .6s cubic-bezier(.4,.2,.2,1);
            transform-style: preserve-3d;
            position: relative;
        }

        .flashcard.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 20px;
            text-align: center;
        }

        .card-front { background: white; border: 2px solid var(--border); }
        .card-back { background: var(--primary); color: white; transform: rotateY(180deg); }
        .fc-word { font-size: 42px; font-weight: 700; margin-bottom: 10px; }
        .fc-pronun { font-size: 20px; color: var(--text-sub); }
        .card-back .fc-word { color: white; }
        .card-back .fc-pronun { color: #DBEAFE; }

        .nav-buttons { display: flex; gap: 20px; align-items: center; }
        .btn-nav {
            padding: 11px 22px;
            border-radius: 50px;
            border: none;
            background: #E9EDF3;
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 850px) {
            .exercise-layout { grid-template-columns: 1fr; }
            .question-nav { position: static; order: -1; }
            .number-grid { grid-template-columns: repeat(10, 1fr); }
            .select-wrap { width: 100%; justify-content: stretch; }
            select { width: 100%; min-width: 0; }
        }

        @media (max-width: 600px) {
            .container { padding: 10px; }
            .top-bar { top: 5px; padding: 11px; }
            .brand { width: 100%; }
            .tabs { width: 100%; }
            .tabs button { flex: 1; }
            .exercise-title-row { align-items: flex-start; }
            .question-card { padding: 16px; }
            .number-grid { grid-template-columns: repeat(5, 1fr); }
            .inline-answer { width: 65%; min-width: 110px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="brand">
                <div class="brand-icon">📚</div>
                <span>Cổng Học Tập</span>
            </div>

            <div class="tabs">
                <button class="active-btn" onclick="showTab('tab-baitap', this)">📝 Bài Tập</button>
                <button onclick="showTab('tab-tuvung', this)">🃏 Flashcards</button>
            </div>

            <div class="select-wrap">
                <select id="chonDe" onchange="taiDeBai()">
                    <option value="">-- Chọn bài tập để bắt đầu --</option>
                </select>
                <select id="chonBoTu" onchange="locBoTu()" style="display:none;">
                    <option value="all">-- Chọn Unit để học --</option>
                </select>
            </div>
        </div>

        <div id="tab-baitap" class="section active">
            <div id="khuVucLamBai" class="exercise-shell">
                <div class="exercise-header">
                    <div class="exercise-title-row">
                        <h2 id="tenDeHienThi" class="exercise-title">Bài tập</h2>
                        <div id="tienDo" class="progress-pill">0 / 0 câu</div>
                    </div>
                    <div class="progress-track">
                        <div id="thanhTienDo" class="progress-fill"></div>
                    </div>
                </div>

                <div class="exercise-layout">
                    <main id="danhSachCauHoi" class="question-list"></main>

                    <aside class="question-nav">
                        <h3>📌 Điều hướng câu hỏi</h3>
                        <div id="luoiSoCau" class="number-grid"></div>
                        <div class="legend">
                            <div><span class="done-dot"></span> Đã trả lời</div>
                            <div><span></span> Chưa trả lời</div>
                        </div>
                    </aside>
                </div>

                <div class="submit-bar">
                    <button class="btn-nop" onclick="nopBai()">NỘP BÀI</button>
                </div>
            </div>
        </div>

        <div id="tab-tuvung" class="section">
            <div class="flashcard-wrapper">
                <div class="flashcard-container" onclick="latThe()">
                    <div class="flashcard" id="theTuVung">
                        <div class="card-face card-front">
                            <div class="fc-word" id="matTruocTu">...</div>
                            <div class="fc-pronun" id="matTruocPhienAm"></div>
                            <div style="margin-top:20px;font-size:13px;color:#94A3B8;">Chạm để lật thẻ</div>
                        </div>
                        <div class="card-face card-back">
                            <div class="fc-word" id="matSauNghia">...</div>
                            <div class="fc-pronun" id="matSauLoai"></div>
                        </div>
                    </div>
                </div>
                <div class="nav-buttons">
                    <button class="btn-nav" onclick="chuyenThe(-1)">⬅️ Trước</button>
                    <span id="boDemThe" style="font-weight:600;color:var(--text-sub);">0/0</span>
                    <button class="btn-nav" onclick="chuyenThe(1)">Tiếp ➡️</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot, orderBy, query } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyC2NWucutuC443gUpIl2IonrFjTuHaCZ2c",
            authDomain: "lop-hoc-tieng-anh.firebaseapp.com",
            projectId: "lop-hoc-tieng-anh"
        }));

        window.showTab = (id, btn) => {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active-btn'));
            btn.classList.add('active-btn');

            document.getElementById('chonDe').style.display = id === 'tab-baitap' ? 'block' : 'none';
            document.getElementById('chonBoTu').style.display = id === 'tab-tuvung' ? 'block' : 'none';
        };

        let deHienTai = null;

        async function loadDanhSachDe() {
            try {
                const snap = await getDocs(query(collection(db, "danhsach_de"), orderBy("thoiGianTao", "desc")));
                const select = document.getElementById('chonDe');
                select.innerHTML = '<option value="">-- Chọn bài tập để bắt đầu --</option>';

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const opt = document.createElement('option');
                    opt.value = docSnap.id;
                    opt.text = data.tenDe;
                    opt.dataset.noiDung = data.noiDungDe || "";
                    opt.dataset.soCau = data.soLuongCau || "";
                    opt.dataset.loaiDe = data.loaiDe || 'tracnghiem';
                    select.add(opt);
                });
            } catch (e) {
                console.error("Không tải được danh sách đề:", e);
            }
        }

        loadDanhSachDe();

        // ---------- Parser ----------

        function isSectionHeader(line) {
            return /^(?:PHẦN|PART)\s+[A-Z0-9]+(?:\s*[-–—:.)]\s*.*)?$/i.test(line.trim());
        }

        function parseSectionHeader(line) {
            const m = line.trim().match(/^(PHẦN|PART)\s+([A-Z0-9]+)(?:\s*[-–—:.)]\s*(.*))?$/i);
            if (!m) return null;
            const prefix = m[1].toUpperCase() === 'PART' ? 'PART' : 'PHẦN';
            const code = m[2].toUpperCase();
            const rest = (m[3] || '').trim();
            return {
                title: rest ? `${prefix} ${code} – ${rest}` : `${prefix} ${code}`,
                code,
                raw: line.trim()
            };
        }

        function isQuestionLine(line) {
            return /^(?:(?:Câu|Question)\s*)?\d+\s*[.):\-]\s+.+$/i.test(line.trim());
        }

        function parseQuestionLine(line) {
            const m = line.trim().match(/^(?:(?:Câu|Question)\s*)?(\d+)\s*[.):\-]\s+(.+)$/i);
            if (!m) return null;
            return { number: Number(m[1]), text: m[2].trim() };
        }

        function parseOptionLine(line) {
            const m = line.trim().match(/^([ABCD])\s*[.):\-]\s+(.+)$/i);
            return m ? { letter: m[1].toUpperCase(), text: m[2].trim() } : null;
        }

        function parseAnswerLine(line) {
            const m = line.trim().match(/^(?:Đáp án|Đ\/A|Answer|ANSWER)\s*:\s*([ABCD])\s*$/i);
            return m ? m[1].toUpperCase() : '';
        }

        function parseExam(rawText, loaiDe) {
            const raw = (rawText || '').replace(/\r/g, '');
            const lines = raw.split('\n');
            const sections = [];
            const allQuestions = [];
            let currentSection = null;
            let currentQuestion = null;
            let preamble = [];

            const ensureSection = () => {
                if (!currentSection) {
                    currentSection = {
                        title: '',
                        instructions: [],
                        questions: []
                    };
                    sections.push(currentSection);
                }
                return currentSection;
            };

            const pushQuestion = () => {
                if (!currentQuestion) return;
                if (!currentQuestion.text.trim()) return;
                const target = ensureSection();
                currentQuestion.options = currentQuestion.options || [];
                target.questions.push(currentQuestion);
                allQuestions.push(currentQuestion);
                currentQuestion = null;
            };

            const pushSection = () => {
                pushQuestion();
                currentSection = null;
            };

            for (const rawLine of lines) {
                const line = rawLine.trim();
                if (!line) {
                    // Preserve blank lines inside section instructions/content only when meaningful.
                    if (currentSection && !currentQuestion && currentSection.instructions.length) {
                        currentSection.instructions.push('');
                    }
                    continue;
                }

                if (isSectionHeader(line)) {
                    pushSection();
                    const header = parseSectionHeader(line);
                    currentSection = {
                        title: header.title,
                        instructions: [],
                        questions: []
                    };
                    sections.push(currentSection);
                    continue;
                }

                const q = parseQuestionLine(line);
                if (q) {
                    pushQuestion();
                    currentSection = ensureSection();
                    currentQuestion = {
                        number: q.number,
                        text: q.text,
                        options: [],
                        correct: ''
                    };
                    continue;
                }

                if (!currentSection) {
                    // Content before the first section/question is global instructions.
                    preamble.push(line);
                    continue;
                }

                if (currentQuestion) {
                    if (loaiDe === 'tracnghiem') {
                        const opt = parseOptionLine(line);
                        if (opt) {
                            currentQuestion.options.push(opt);
                            continue;
                        }

                        const answer = parseAnswerLine(line);
                        if (answer) {
                            currentQuestion.correct = answer;
                            continue;
                        }
                    }
                    currentQuestion.text += '\n' + line;
                } else {
                    // Keep every instruction/Box/Word box line exactly as supplied.
                    currentSection.instructions.push(line);
                }
            }

            pushQuestion();

            // Remove accidental empty sections.
            const cleanSections = sections.filter(sec =>
                sec.title || sec.instructions.some(x => x.trim()) || sec.questions.length
            );

            // If no explicit section exists, preserve old behavior as one default section.
            if (!cleanSections.length && (preamble.length || allQuestions.length)) {
                cleanSections.push({
                    title: '',
                    instructions: preamble,
                    questions: allQuestions
                });
            } else if (cleanSections.length && preamble.length) {
                // Preamble before first section is retained as global instructions in the first section.
                const first = cleanSections[0];
                first.instructions = [...preamble, ...first.instructions];
            }

            // Keep the exact question numbers and compute count from actual questions.
            const questions = cleanSections.flatMap(sec => sec.questions);

            return {
                preamble: preamble.join('\n').trim(),
                sections: cleanSections,
                questions,
                questionNumbers: questions.map(q => q.number),
                count: questions.length
            };
        }

        function tachCauHoi(rawText, soCau, loaiDe) {
            const parsed = parseExam(rawText, loaiDe);
            return parsed;
        }

        // ---------- Render ----------
        window.taiDeBai = () => {
            const select = document.getElementById('chonDe');

            if (!select.value) {
                document.getElementById('khuVucLamBai').style.display = 'none';
                deHienTai = null;
                return;
            }

            const opt = select.options[select.selectedIndex];
            const raw = opt.dataset.noiDung || '';
            const loaiDe = opt.dataset.loaiDe || 'tracnghiem';
            const parsed = parseExam(raw, loaiDe);

            deHienTai = {
                id: opt.value,
                ten: opt.text,
                soCau: parsed.count,
                loaiDe,
                noiDung: raw,
                parsed,
                cauHoi: parsed.questions,
                instructions: parsed.preamble
            };

            document.getElementById('tenDeHienThi').textContent = deHienTai.ten;
            renderBaiTap();

            const khuVuc = document.getElementById('khuVucLamBai');
            khuVuc.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function renderBaiTap() {
            const list = document.getElementById('danhSachCauHoi');
            const nav = document.getElementById('luoiSoCau');
            list.innerHTML = '';
            nav.innerHTML = '';

            const parsed = deHienTai.parsed;
            const questions = parsed.questions || [];
            const total = questions.length;

            parsed.sections.forEach(section => {
                if (section.title) {
                    const sectionCard = document.createElement('section');
                    sectionCard.className = 'exam-section-student';

                    const title = document.createElement('div');
                    title.className = 'exam-section-student-title';
                    title.textContent = `📌 ${section.title}`;
                    sectionCard.appendChild(title);

                    if (section.instructions.length) {
                        const instruction = document.createElement('div');
                        instruction.className = 'exam-section-student-instruction';
                        instruction.textContent = section.instructions.join('\n');
                        sectionCard.appendChild(instruction);
                    }

                    const questionList = document.createElement('div');
                    questionList.className = 'exam-section-questions';
                    section.questions.forEach(q => questionList.appendChild(createStudentQuestionCard(q)));
                    sectionCard.appendChild(questionList);
                    list.appendChild(sectionCard);
                } else {
                    if (section.instructions.length) {
                        const instruction = document.createElement('div');
                        instruction.className = 'exercise-instruction';
                        instruction.innerHTML =
                            `<span class="exercise-instruction-title">📌 Đề bài</span>${escapeHtml(section.instructions.join('\n'))}`;
                        list.appendChild(instruction);
                    }
                    section.questions.forEach(q => list.appendChild(createStudentQuestionCard(q)));
                }
            });

            questions.forEach(q => {
                const navBtn = document.createElement('button');
                navBtn.className = 'number-btn';
                navBtn.textContent = q.number;
                navBtn.onclick = () => {
                    document.getElementById(`question-${q.number}`)?.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                };
                nav.appendChild(navBtn);
            });

            document.getElementById('tienDo').textContent = `0 / ${total} câu`;
            document.getElementById('thanhTienDo').style.width = '0%';

            list.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', capNhatTienDo);
                input.addEventListener('change', capNhatTienDo);
            });

            capNhatTienDo();
        }

        function createStudentQuestionCard(q) {
            const card = document.createElement('article');
            card.className = 'question-card';
            card.id = `question-${q.number}`;
            card.dataset.question = q.number;

            let textHtml = escapeHtml(q.text).replace(
                /_{3,}/g,
                `<input class="inline-answer" data-question="${q.number}" placeholder="Nhập đáp án..." autocomplete="off">`
            );

            let content = `<div class="question-text"><span class="question-number">${q.number}</span>${textHtml}</div>`;

            if (deHienTai.loaiDe === 'tracnghiem') {
                if (q.options.length) {
                    content += '<div class="options-list">';
                    q.options.forEach(option => {
                        content += `
                            <label class="answer-option">
                                <input type="radio" name="cau${q.number}" value="${escapeHtml(option.letter)}">
                                <span class="letter">${escapeHtml(option.letter)}</span>
                                <span class="option-text">${escapeHtml(option.text)}</span>
                            </label>`;
                    });
                    content += '</div>';
                } else {
                    content += `<div class="question-help">⚠️ Câu này chưa có lựa chọn A/B/C/D.</div>`;
                }
            } else if (!q.text.includes('___')) {
                content += `<input class="inline-answer" data-question="${q.number}" data-blank="1" placeholder="Nhập đáp án..." autocomplete="off">`;
            }

            card.innerHTML = content;
            return card;
        }

        function cauDaTraLoi(questionNumber) {
            const q = deHienTai?.cauHoi?.find(item => item.number === questionNumber);
            if (!q) return false;

            if (deHienTai.loaiDe === 'dientu') {
                const inputs = document.querySelectorAll(
                    `.inline-answer[data-question="${questionNumber}"]`
                );
                return Array.from(inputs).some(input => input.value.trim() !== '');
            }

            return !!document.querySelector(`input[name="cau${questionNumber}"]:checked`);
        }

        function capNhatTienDo() {
            if (!deHienTai?.cauHoi) return;

            const questions = deHienTai.cauHoi;
            const total = questions.length;
            let done = 0;

            questions.forEach(q => {
                const answered = cauDaTraLoi(q.number);
                if (answered) done++;

                const card = document.getElementById(`question-${q.number}`);
                const btn = Array.from(document.querySelectorAll('.number-btn'))
                    .find(x => x.textContent === String(q.number));

                card?.classList.toggle('answered', answered);
                btn?.classList.toggle('answered', answered);
            });

            document.getElementById('tienDo').textContent = `${done} / ${total} câu`;
            document.getElementById('thanhTienDo').style.width =
                `${total ? Math.round(done / total * 100) : 0}%`;
        }

        // ---------- Submit ----------
        window.nopBai = async () => {
            if (!deHienTai) return;
            if (!confirm("Kiểm tra kỹ lại nhé, bạn chắc chắn muốn nộp bài?")) return;

            const dapAnHocSinh = {};

            deHienTai.cauHoi.forEach(q => {
                if (deHienTai.loaiDe === 'dientu') {
                    const inputs = document.querySelectorAll(
                        `.inline-answer[data-question="${q.number}"]`
                    );
                    const values = Array.from(inputs)
                        .map(input => input.value.trim())
                        .filter(Boolean);

                    dapAnHocSinh[q.number] =
                        values.length ? values.join(' | ') : 'Chưa làm';
                } else {
                    const chon = document.querySelector(
                        `input[name="cau${q.number}"]:checked`
                    );
                    dapAnHocSinh[q.number] =
                        chon ? chon.value : 'Chưa làm';
                }
            });

            try {
                await addDoc(collection(db, "ketqua_hocsinh"), {
                    idDe: deHienTai.id,
                    tenDe: deHienTai.ten,
                    dapAn: dapAnHocSinh,
                    thoiGianNop: Date.now()
                });

                alert("Nộp bài thành công!");
                document.getElementById('khuVucLamBai').style.display = 'none';
                document.getElementById('chonDe').value = '';
                deHienTai = null;
            } catch (e) {
                console.error(e);
                alert("Không thể nộp bài. Vui lòng kiểm tra kết nối rồi thử lại.");
            }
        };

        // ---------- Flashcards ----------
        let danhSachGoc = [], danhSachHienTai = [], viTri = 0;

        onSnapshot(query(collection(db, "tu_vung"), orderBy("thoiGianTao", "desc")), (snapshot) => {
            danhSachGoc = [];
            let danhSachBoTu = new Set();

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                danhSachGoc.push(data);
                if (data.tenBo) danhSachBoTu.add(data.tenBo);
            });

            const select = document.getElementById('chonBoTu');
            const luaChonCu = select.value;

            select.innerHTML = '<option value="all">-- Tất cả từ vựng --</option>';
            danhSachBoTu.forEach(bo => select.add(new Option(bo, bo)));

            if (danhSachBoTu.has(luaChonCu)) select.value = luaChonCu;
            locBoTu();
        });

        window.locBoTu = () => {
            const chon = document.getElementById('chonBoTu').value;
            danhSachHienTai = chon === 'all'
                ? [...danhSachGoc]
                : danhSachGoc.filter(tu => tu.tenBo === chon);

            viTri = 0;
            capNhatGiaoDienThe();
        };

        window.latThe = () =>
            document.getElementById('theTuVung').classList.toggle('is-flipped');

        window.chuyenThe = (buocNhay) => {
            if (danhSachHienTai.length === 0) return;

            document.getElementById('theTuVung').classList.remove('is-flipped');

            setTimeout(() => {
                viTri += buocNhay;
                if (viTri < 0) viTri = danhSachHienTai.length - 1;
                if (viTri >= danhSachHienTai.length) viTri = 0;
                capNhatGiaoDienThe();
            }, 200);
        };

        function capNhatGiaoDienThe() {
            if (danhSachHienTai.length === 0) {
                document.getElementById('matTruocTu').textContent = "Chưa có thẻ nào!";
                document.getElementById('matTruocPhienAm').textContent = "";
                document.getElementById('matSauNghia').textContent = "";
                document.getElementById('boDemThe').textContent = "0/0";
                return;
            }

            const tu = danhSachHienTai[viTri];

            document.getElementById('matTruocTu').textContent = tu.tuAnh;
            document.getElementById('matTruocPhienAm').textContent = tu.phienAm || "";
            document.getElementById('matSauNghia').textContent = tu.nghiaViet;
            document.getElementById('matSauLoai').textContent =
                tu.loaiTu ? `(${tu.loaiTu})` : "";
            document.getElementById('boDemThe').textContent =
                `${viTri + 1} / ${danhSachHienTai.length}`;
        }
    </script>
</body>
</html>
